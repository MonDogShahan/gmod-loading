<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在連線至伺服器...</title>
    <style>
        body {
            background-color: #1b2838;
            color: #c7d5e0;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 15vh;
            margin: 0;
        }
        h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #8f98a0;
            margin-bottom: 30px;
            white-space: pre-line; /* 允許文字換行 */
        }
        .btn {
            display: inline-block;
            background: linear-gradient(to right, #47bfff 5%, #1a44c2 60%);
            background-position: 25%;
            background-size: 330% 100%;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 3px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-position: 0%;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h2>伺服器連線準備中...</h2>
    <p id="status-text">正在偵測 DDNS 的最新真實 IP...</p>
    
    <a href="#" id="manual-btn" class="btn" style="display: none;">🚀 手動連接伺服器</a>

    <script>
        window.onload = async function() {
            // 你的伺服器設定
            const domain = "hananekohime.ddns.net";
            const port = "6666";
            const password = "hana1236";
            let targetAddress = domain; // 預設值，若解析失敗則使用原網域

            try {
                // 透過 Google DNS API 即時解析 No-IP 網域取得當下真實 IP
                const response = await fetch(`https://dns.google/resolve?name=${domain}&type=A`);
                const data = await response.json();
                
                // 確定有抓到解析結果 (A 紀錄)
                if (data.Answer && data.Answer.length > 0) {
                    targetAddress = data.Answer[0].data;
                    document.getElementById("status-text").innerText = `已成功轉換真實 IP：${targetAddress}\n正在啟動 GMOD 並輸入密碼連線...`;
                } else {
                    throw new Error("找不到 IP 紀錄");
                }
            } catch (error) {
                console.error("IP 解析失敗", error);
                document.getElementById("status-text").innerText = `無法偵測真實 IP，將使用備用網域模式...\n正在啟動 GMOD 並輸入密碼連線...`;
            }

            // 組合最終的 Steam 連線指令 (IP:Port/Password)
            const connectUrl = `steam://connect/${targetAddress}:${port}/${password}`;
            
            // 將設定好的指令綁定到按鈕上，並顯示按鈕
            const btn = document.getElementById("manual-btn");
            btn.href = connectUrl;
            btn.style.display = "inline-block";

            // 稍微延遲 0.8 秒，讓玩家能看清楚畫面上的 IP 資訊，然後自動執行導向
            setTimeout(function() {
                window.location.href = connectUrl;
            }, 800);
        };
    </script>

</body>
</html>
